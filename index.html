<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngành Trung Thế - Hệ Thống File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @layer utilities {
            .animate-in {
                animation: animate-in 1000ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .fade-in { animation-name: fade-in; }
            .slide-in-from-top-4 { animation-name: slide-in-from-top-4; }
            .slide-in-from-bottom-8 { animation-name: slide-in-from-bottom-8; }
            .slide-in-from-bottom-12 { animation-name: slide-in-from-bottom-12; }
            .zoom-in-95 { animation-name: zoom-in-95; }
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-in-from-top-4 {
            from { transform: translateY(-1rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slide-in-from-bottom-8 {
            from { transform: translateY(2rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slide-in-from-bottom-12 {
            from { transform: translateY(3rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes zoom-in-95 {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #060B19; }
        ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.3); }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.1); border-radius: 9999px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen bg-[#060B19] text-slate-200 font-sans relative overflow-x-hidden selection:bg-white/20 flex flex-col">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center">
        <div class="absolute top-[20%] left-[20%] w-[60vw] h-[60vw] rounded-full bg-indigo-600/20 blur-[150px] mix-blend-screen animate-[pulse_10s_ease-in-out_infinite]"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[50vw] h-[50vw] rounded-full bg-cyan-600/15 blur-[120px] mix-blend-screen animate-[pulse_15s_ease-in-out_infinite_alternate]"></div>
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:64px_64px] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,#000_70%,transparent_100%)]"></div>
    </div>

    <div class="relative z-10 max-w-[1200px] mx-auto px-6 md:px-12 flex flex-col min-h-screen w-full">
        
        <header class="py-6 flex justify-between items-center w-full mb-2 animate-in fade-in slide-in-from-top-4">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-white/[0.05] border border-white/[0.1] flex items-center justify-center group-hover:bg-white/[0.15] transition-all shadow-[0_0_20px_rgba(255,255,255,0.02)]">
                    <i data-lucide="waves" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-[0.2em] text-white uppercase">Ngành Trung Thế</h1>
                    <p class="text-[10px] font-mono text-slate-400 tracking-widest uppercase mt-0.5">Hệ Thống File</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-white/[0.04] border border-white/[0.1] rounded-full px-4 py-2 backdrop-blur-md">
                <div class="flex items-center gap-2.5">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span id="realtime-clock" class="text-[12px] text-white font-bold font-mono tracking-wider w-[60px] text-center">00:00:00</span>
                </div>
                <div class="w-px h-4 bg-white/20"></div>
                <div class="w-6 h-6 rounded-full bg-white/5 border border-white/10 flex items-center justify-center">
                    <i data-lucide="fingerprint" class="w-3 h-3 text-slate-300"></i>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col justify-center pb-10 pt-2 relative">
            
            <div id="home-view" class="transition-all duration-1000 ease-out opacity-100 scale-100 relative">
                
                <div id="hero-section" class="flex flex-col items-center text-center transition-all duration-1000 mb-10 mt-4">
                    <div id="welcome-text" class="animate-in fade-in slide-in-from-bottom-8">
                        <h2 id="greeting-text" class="text-4xl md:text-5xl lg:text-6xl font-light text-white tracking-tight mb-4">
                            </h2>
                        <p class="text-base md:text-lg text-slate-300 font-light mb-8 tracking-wide max-w-2xl mx-auto opacity-90">
                            Không gian quản lý báo cáo, dữ liệu và quy trình chuẩn của khối sản xuất.
                        </p>
                    </div>
                </div>

                <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mx-auto">
                    </div>
            </div>

            <div id="detail-view" class="transition-all duration-700 ease-in-out absolute inset-x-0 opacity-0 scale-105 pointer-events-none z-50">
                </div>

        </main>

        <footer class="py-6 border-t border-white/[0.05] flex justify-center opacity-60">
            <p class="text-[10px] font-bold font-mono tracking-[0.4em] text-slate-500 uppercase">
                © 2026 NGÀNH TRUNG THẾ <span class="mx-2 text-white/20">|</span> PHÁT TRIỂN BỞI: MAI VĂN THẠNH
            </p>
        </footer>

    </div>

    <script>
        const FILE_CATEGORIES = [
            {

                iconName: 'file-text', iconColor: 'text-orange-400',
                title: 'BÁO CÁO', 
                desc: 'Xem kết quả sản xuất, tiến độ đơn hàng và tình hình chạy máy.', 
                files: [
                    { name: 'Báo Cáo Tiến Độ Sản Xuất', note: 'Theo dõi tổng quan tiến độ sản xuất (LSX) & sản lượng hàng ngày', url: 'https://docs.google.com/spreadsheets/d/1frC8tlVWaC0ID1VwoYoJC9pVF68oNsYJBZkunZHjNA0/edit?usp=sharing' },
                    { name: 'Báo Cáo Thứ Tự Ưu Tiên', note: 'Theo dõi thứ tự ưu tiên xử lý các đơn hàng/LSX', url: 'https://cadivivietnam.sharepoint.com/:x:/s/nmsaigon/IQDteNImJGJPQ6sLJRVkrKRtASXTztEuyMkx0Vr8uz-ZNS4?e=V0g6vB' },
                    { name: 'Báo Cáo Hao Hụt Vật Tư', note: 'Thống kê hao hụt nhựa (máy 150-1)', url: 'https://docs.google.com/spreadsheets/d/1psZjAGlIrs1Lett0Pn9jEGlPJQpjrxzmmYib0rq3vro/edit?usp=drive_link' },
                    { name: 'Nhật Ký Sự Cố Sản Xuất', note: 'Log dữ liệu dừng máy, sự cố sản xuất', url: 'https://docs.google.com/spreadsheets/d/1iglhTTQmQjEmm1k0GJlSKjFZ3RrG_xRrI41FNylNHPQ/edit?usp=drive_link' },
                    { name: 'Báo Cáo Hiệu Suất (OEE)', note: 'Xem thời gian máy chạy & các khoảng thời gian phải dừng máy', url: '#' }
                ] 
            },
            { 
                id: 'nhaplieu', 
                colors: { main: 'cyan', text: 'text-cyan-400', glow: 'from-cyan-500/40 via-cyan-500/10 to-transparent', border: 'group-hover:border-cyan-500/50', iconBg: 'bg-cyan-500/20' },
                iconName: 'database', iconColor: 'text-cyan-400',
                title: 'BIỂU NHẬP LIỆU', 
                desc: 'Nơi cập nhật dữ liệu chạy máy của các máy', 
                files: [
                    { name: 'Nhập Liệu Kéo Xoắn', note: 'Ghi nhận dữ liệu & sản lượng ca công đoạn kéo xoắn', url: 'https://docs.google.com/spreadsheets/d/1x9RWzuJ_pX-DptP_MDOa5h0dRLjsNWXgPlimsByF71w/edit?usp=sharing' },
                    { name: 'Nhập Liệu Bọc', note: 'Ghi nhận dữ liệu & sản lượng ca công đoạn bọc', url: 'https://docs.google.com/spreadsheets/d/173-VOqYWRt1a_AZ6ZKgBCsoieQhEJaAOTT6XWW1Xibk/edit?usp=sharing' },
                    { name: 'Nhập Liệu CCVL', note: 'Ghi nhận dữ liệu & sản lượng ca công đoạn CCVL', url: 'https://docs.google.com/spreadsheets/d/1pY_dUEmiuWnaArQ4K0h7gsxyR-3QlNynWUf03fgkkwY/edit?usp=sharing' },
                    { name: 'Giải Trình QTVT', note: 'Biểu ghi nhận & giải trình các vấn đề phát sinh trong công đoạn CCVL', url: 'https://docs.google.com/spreadsheets/d/1Gy1dMiSkyTACtj765kATRwQ1FXyiBX-IxvOzmzJWDHw/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'tinhtoan', 
                colors: { main: 'purple', text: 'text-purple-400', glow: 'from-purple-500/40 via-purple-500/10 to-transparent', border: 'group-hover:border-purple-500/50', iconBg: 'bg-purple-500/20' },
                iconName: 'calculator', iconColor: 'text-purple-400',
                title: 'CÔNG CỤ TÍNH TOÁN', 
                desc: 'File tính nhanh', 
                files: [
                    { name: 'Dự Báo Thời Gian Tiến Độ', note: 'Công cụ tính toán dự kiến thời gian hoàn thành đơn hàng/LSX.', url: 'https://docs.google.com/spreadsheets/d/1B-qRiKjlEZw4nArUaG-joRzh5U1ZUuW_f5EXNFBuQLE/edit?usp=sharing' },
                    { name: 'Tính Sức Chứa Ture', note: 'Tính toán sức chứa của ture & trọng lượng ture', url: 'https://docs.google.com/spreadsheets/d/1MnZ-QwGlFKC9L8kFWfntyOMCYbJwCnHejU9zJp61rU8/edit?usp=sharing' },
                    { name: 'Quy Đổi Trọng Lượng & Chiều Dài', note: 'Tool quy đổi nhanh hệ số Kg ↔ Mét cho các dòng máy DRUM.', url: 'https://docs.google.com/spreadsheets/d/1w2sHeFpmBOFY2s_ewWX4iTYAOqivarST2GYQwI-Jyus/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'nhansu', 
                colors: { main: 'emerald', text: 'text-emerald-400', glow: 'from-emerald-500/40 via-emerald-500/10 to-transparent', border: 'group-hover:border-emerald-500/50', iconBg: 'bg-emerald-500/20' },
                iconName: 'users', iconColor: 'text-emerald-400',
                title: 'QUẢN LÝ NHÂN SỰ', 
                desc: 'Theo dõi tình hình nhân sự', 
                files: [
                    { name: 'Danh Sách Nhân Sự', note: 'Chi tiết nhân sự của từng tổ', url: 'https://docs.google.com/spreadsheets/d/1IRFJuO6DXAPec66QtAcGtYAzpSO9_Xo_mSJ8fa5ORus/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'dinhmuc', 
                colors: { main: 'pink', text: 'text-pink-400', glow: 'from-pink-500/40 via-pink-500/10 to-transparent', border: 'group-hover:border-pink-500/50', iconBg: 'bg-pink-500/20' },
                iconName: 'activity', iconColor: 'text-pink-400',
                title: 'ĐỊNH MỨC SẢN XUẤT', 
                desc: 'Bảng chỉ tiêu sản lượng máy', 
                files: [
                    { name: 'Định Mức Sản Lượng (Ca/Máy)', note: 'Bảng chỉ tiêu sản lượng chuẩn cho từng máy.', url: 'https://docs.google.com/spreadsheets/d/1RRSFQK7GocjevGYC-uYkkXwRenyN2U0qHXtx2B69I44/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'tailieu', 
                colors: { main: 'slate', text: 'text-slate-300', glow: 'from-slate-400/40 via-slate-400/10 to-transparent', border: 'group-hover:border-slate-400/50', iconBg: 'bg-slate-400/20' },
                iconName: 'archive', iconColor: 'text-slate-300',
                title: 'TÀI LIỆU & QUY TRÌNH', 
                desc: 'Kho lưu các hướng dẫn làm việc, nội quy và biểu mẫu chung.', 
                files: [
                    { name: 'Hướng Dẫn Công Nghệ', note: 'Hướng dẫn chung & thông số kỹ thuật ngành Trung thế & Hạ thế', url: 'https://drive.google.com/drive/folders/10QPukkdvOz2zybUfnsM7n64OiT0ascqz?usp=sharing' },
                    { name: 'Tài Liệu Nội Bộ', note: 'Hướng dẫn vận hành máy và các quy định của nhà máy', url: 'https://drive.google.com/drive/folders/1ZcukORZ2BSx71RL2ZUjxKoZ1GgmCiM1u?usp=sharing' },
                    { name: 'Trung Tâm Liên Kết', note: 'Cổng Hub lưu trữ các đường link hệ thống', url: 'https://maivanthanh1405.github.io/portal-san-xuat/' }
                ] 
            }
        ];

        lucide.createIcons();

        // Xử lý Lời Chào thời gian thực
        const greetingEl = document.getElementById('greeting-text');
        const hour = new Date().getHours();
        if (hour < 12) greetingEl.textContent = 'Chào buổi sáng';
        else if (hour < 18) greetingEl.textContent = 'Chào buổi chiều';
        else greetingEl.textContent = 'Chào buổi tối';

        // Xử lý Đồng hồ thời gian thực
        const clockEl = document.getElementById('realtime-clock');
        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('vi-VN', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        const categoriesGrid = document.getElementById('categories-grid');
        const homeView = document.getElementById('home-view');
        const detailView = document.getElementById('detail-view');

        // Hàm render giao diện trang chủ
        function renderCategories() {
            categoriesGrid.innerHTML = '';
            FILE_CATEGORIES.forEach((cat, idx) => {
                const animDelay = idx * 100;
                // Thêm class vision-container và cấu hình 3D Perspective
                const buttonHTML = `
                    <button
                        onclick="openCategoryDetail('${cat.id}')"
                        class="vision-container group relative text-left outline-none focus:outline-none animate-in fade-in slide-in-from-bottom-12 h-full w-full"
                        style="animation-delay: ${animDelay}ms; animation-fill-mode: both; perspective: 1200px;"
                    >
                        <div class="vision-card relative h-full bg-slate-900/60 group-hover:bg-slate-800/80 border border-white/[0.08] group-hover:border-white/[0.3] backdrop-blur-[60px] backdrop-saturate-[150%] rounded-[2rem] p-6 md:p-8 overflow-hidden flex flex-col" style="transform-style: preserve-3d; transition: background-color 0.5s, border-color 0.5s, box-shadow 0.5s, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
                            
                            <div class="glow-orb absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[180%] h-[180%] ${cat.colors.iconBg} blur-[80px] opacity-0 pointer-events-none z-0"></div>
                            
                            <div class="absolute inset-0 bg-gradient-to-br ${cat.colors.glow} opacity-0 group-hover:opacity-100 transition-all duration-700 pointer-events-none z-0"></div>

                            <div class="flex items-start justify-between mb-8 relative z-10" style="transform: translateZ(40px);">
                                <div class="w-14 h-14 rounded-2xl ${cat.colors.iconBg} border border-white/[0.1] flex items-center justify-center shadow-inner backdrop-blur-md">
                                    <i data-lucide="${cat.iconName}" class="w-7 h-7 ${cat.iconColor}"></i>
                                </div>
                                <div class="w-8 h-8 rounded-full border border-white/[0.1] flex items-center justify-center text-slate-400 bg-white/[0.03] group-hover:bg-white/20 group-hover:text-white transition-colors">
                                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </div>
                            </div>

                            <div class="relative z-10 mt-auto" style="transform: translateZ(25px);">
                                <h3 class="text-xl font-bold text-white/90 mb-2 tracking-wide group-hover:text-white transition-colors">${cat.title}</h3>
                                <p class="text-sm text-slate-300 font-normal mb-5 opacity-80 leading-relaxed">${cat.desc}</p>
                                
                                <div class="flex items-center gap-2">
                                    <i data-lucide="activity" class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-colors"></i>
                                    <span class="text-[10px] font-bold font-mono text-slate-500 group-hover:text-slate-300 transition-colors uppercase tracking-widest">
                                        ${cat.files.length} TÀI LIỆU
                                    </span>
                                </div>
                            </div>
                        </div>
                    </button>
                `;
                categoriesGrid.insertAdjacentHTML('beforeend', buttonHTML);
            });
            lucide.createIcons();
            initVisionProEffect(); // Khởi chạy hiệu ứng
        }

        // Script chính tạo độ nghiêng 3D và Cực quang theo chuột
        window.initVisionProEffect = function() {
            const containers = document.querySelectorAll('.vision-container:not(.vision-init)');
            containers.forEach(container => {
                container.classList.add('vision-init'); // Tránh lặp sự kiện
                const card = container.querySelector('.vision-card');
                const orb = container.querySelector('.glow-orb');
                if(!card) return;
                
                container.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    // Tính góc nghiêng (Tối đa 6 độ)
                    const rotateX = ((y - centerY) / centerY) * -6; 
                    const rotateY = ((x - centerX) / centerX) * 6;
                    
                    // Phản hồi lập tức
                    card.style.transition = 'transform 0.1s ease-out, box-shadow 0.1s ease-out';
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
                    card.style.boxShadow = `0 30px 60px rgba(0,0,0,0.8)`;
                    
                    // Cực quang tracking chuột
                    if(orb) {
                        orb.style.transition = 'opacity 0.3s ease-out';
                        orb.style.opacity = '0.8';
                        orb.style.transform = `translate(calc(-50% + ${x - centerX}px), calc(-50% + ${y - centerY}px))`;
                    }
                });
                
                container.addEventListener('mouseleave', () => {
                    // Trả về vị trí cũ cực êm ái
                    card.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s ease-out';
                    card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    card.style.boxShadow = `0 10px 30px rgba(0,0,0,0.2)`;
                    
                    if(orb) {
                        orb.style.transition = 'transform 0.6s ease-out, opacity 0.6s ease-out';
                        orb.style.opacity = '0';
                        orb.style.transform = `translate(-50%, -50%)`;
                    }
                });
            });
        };

        renderCategories();

        // Xử lý mở Màn hình Chi Tiết (Split Pane)
        window.openCategoryDetail = function(categoryId) {
            const category = FILE_CATEGORIES.find(c => c.id === categoryId);
            if (!category) return;

            // FIX KHỰNG: Dùng scrollTo tức thì
            window.scrollTo(0, 0);

            // Render Các File Chi Tiết có hỗ trợ 3D Hover
            let filesHTML = '';
            category.files.forEach(file => {
                filesHTML += `
                    <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="vision-container group relative block w-full outline-none focus:outline-none" style="perspective: 1000px;">
                        <div class="vision-card flex items-center justify-between p-5 rounded-[1.5rem] bg-white/[0.03] border border-white/[0.05] overflow-hidden cursor-pointer" style="transform-style: preserve-3d; transition: background-color 0.5s, border-color 0.5s, box-shadow 0.5s, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);">
                            
                            <div class="glow-orb absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] ${category.colors.iconBg} blur-[60px] opacity-0 rounded-full pointer-events-none z-0"></div>

                            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/[0.03] to-transparent -translate-x-[100%] group-hover:translate-x-[100%] transition-transform duration-1000 ease-in-out pointer-events-none z-0"></div>
                            
                            <div class="flex items-center gap-5 relative z-10 min-w-0 flex-1" style="transform: translateZ(20px);">
                                <div class="w-12 h-12 rounded-xl bg-[#0B101E] border border-white/[0.1] flex items-center justify-center ${category.colors.text} transition-colors shrink-0">
                                    <i data-lucide="file-text" class="w-5 h-5 opacity-90"></i>
                                </div>
                                
                                <div class="flex-1 min-w-0 pr-4">
                                    <h4 class="font-bold tracking-wide text-white/90 text-lg truncate mb-1">
                                        ${file.name}
                                    </h4>
                                    <p class="text-sm text-slate-400 truncate font-normal opacity-90">
                                        ${file.note}
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center gap-4 relative z-10 shrink-0" style="transform: translateZ(30px);">
