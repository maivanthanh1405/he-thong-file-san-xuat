<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngành Trung Thế - Hệ Thống File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thêm thư viện Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* CSS cho các class động của Tailwind */
        @layer utilities {
            .animate-in {
                animation: animate-in 1000ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .fade-in {
                animation-name: fade-in;
            }
            .slide-in-from-top-4 {
                animation-name: slide-in-from-top-4;
            }
            .slide-in-from-bottom-8 {
                animation-name: slide-in-from-bottom-8;
            }
            .slide-in-from-bottom-12 {
                animation-name: slide-in-from-bottom-12;
            }
            .zoom-in-95 {
                animation-name: zoom-in-95;
            }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slide-in-from-top-4 {
            from { transform: translateY(-1rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slide-in-from-bottom-8 {
            from { transform: translateY(2rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slide-in-from-bottom-12 {
            from { transform: translateY(3rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes zoom-in-95 {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        /* Scrollbar toàn trang (Tùy chỉnh thanh cuộn trình duyệt) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #010205;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Scrollbar cho các thẻ con bên trong */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-[#010205] text-slate-200 font-sans relative overflow-x-hidden selection:bg-white/20">

    <!-- 1. MÔI TRƯỜNG KHÔNG GIAN (SPATIAL ENVIRONMENT) -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center">
        <!-- Core Glow -->
        <div class="absolute top-[20%] left-[20%] w-[60vw] h-[60vw] rounded-full bg-indigo-900/20 blur-[150px] mix-blend-screen animate-[pulse_10s_ease-in-out_infinite]"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[50vw] h-[50vw] rounded-full bg-cyan-900/15 blur-[120px] mix-blend-screen animate-[pulse_15s_ease-in-out_infinite_alternate]"></div>
        <!-- Lưới tọa độ không gian siêu mờ -->
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.015)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.015)_1px,transparent_1px)] bg-[size:64px_64px] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,#000_70%,transparent_100%)]"></div>
    </div>

    <div class="relative z-10 max-w-[1400px] mx-auto px-6 md:px-12 flex flex-col min-h-screen">
        
        <!-- 2. TOP BAR -->
        <header class="py-8 flex justify-between items-center w-full mb-4 animate-in fade-in slide-in-from-top-4">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-white/[0.03] border border-white/[0.08] flex items-center justify-center group-hover:bg-white/[0.08] transition-all shadow-[0_0_20px_rgba(255,255,255,0.02)]">
                    <i data-lucide="waves" class="w-5 h-5 text-slate-300"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-[0.2em] text-white uppercase">Ngành Trung Thế</h1>
                    <p class="text-[10px] font-mono text-slate-500 tracking-widest uppercase">Hệ Thống File</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-white/[0.02] border border-white/[0.05] rounded-full px-4 py-2 backdrop-blur-md">
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)] animate-pulse"></span>
                    <span class="hidden sm:block text-[11px] text-slate-400 font-mono tracking-wider">ONLINE</span>
                </div>
                <div class="w-px h-4 bg-white/10"></div>
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-slate-700 to-slate-400 flex items-center justify-center">
                    <i data-lucide="fingerprint" class="w-3 h-3 text-white"></i>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col pb-24 relative">
            
            <!-- KHU VỰC TRANG CHỦ -->
            <div id="home-view" class="transition-all duration-1000 ease-out opacity-100 scale-100 relative">
                
                <!-- 3. HERO & SEARCH TRUNG TÂM -->
                <div id="hero-section" class="flex flex-col items-center text-center transition-all duration-1000 mb-20 mt-8">
                    
                    <div id="welcome-text" class="animate-in fade-in slide-in-from-bottom-8">
                        <h2 id="greeting-text" class="text-5xl md:text-6xl lg:text-7xl font-extralight text-white tracking-tight mb-6">
                            <!-- Chào buổi sáng/chiều/tối -->
                        </h2>
                        <p class="text-lg md:text-xl text-slate-400 font-light mb-12 tracking-wide max-w-2xl mx-auto">
                            Không gian quản lý báo cáo, dữ liệu và quy trình chuẩn của khối sản xuất.
                        </p>
                    </div>

                    <!-- Ô TÌM KIẾM CỰC QUANG (Aura Search) -->
                    <div class="relative w-full max-w-3xl group z-30">
                        <div class="absolute -inset-2 bg-gradient-to-r from-cyan-500/10 via-indigo-500/10 to-purple-500/10 rounded-[2.5rem] blur-2xl opacity-0 group-focus-within:opacity-100 transition-opacity duration-1000"></div>
                        <div class="relative flex items-center p-2.5 bg-white/[0.02] border border-white/[0.05] group-focus-within:border-white/20 backdrop-blur-[40px] backdrop-saturate-[150%] rounded-[2.5rem] shadow-[0_8px_32px_rgba(0,0,0,0.4)] transition-all duration-500">
                            <div class="w-14 h-14 flex items-center justify-center rounded-full bg-white/[0.02] ml-2 shrink-0">
                                <i data-lucide="search" class="w-6 h-6 text-slate-400 group-focus-within:text-white transition-colors"></i>
                            </div>
                            <input 
                                type="text" 
                                id="search-input"
                                placeholder="Biểu nhập liệu, báo cáo , tính toán..." 
                                class="w-full bg-transparent border-0 text-white placeholder-slate-600 text-xl py-4 pl-4 pr-6 focus:ring-0 outline-none font-light tracking-wide"
                            >
                            <button id="clear-search-btn" class="hidden mr-3 px-4 py-3 items-center gap-2 rounded-full bg-white/[0.05] hover:bg-white/[0.1] text-slate-300 hover:text-white transition-all shrink-0 text-sm font-medium">
                                <i data-lucide="chevron-left" class="w-4 h-4"></i> Đóng
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 4. KẾT QUẢ TÌM KIẾM -->
                <div id="search-results-container" class="hidden max-w-4xl mx-auto animate-in fade-in slide-in-from-bottom-8">
                    <div class="bg-white/[0.02] backdrop-blur-[50px] backdrop-saturate-[150%] border border-white/[0.05] rounded-[2rem] p-4 shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
                        <div id="search-results-list" class="space-y-2">
                            <!-- Kết quả tìm kiếm sẽ được render bằng JS ở đây -->
                        </div>
                    </div>
                </div>

                <!-- 5. LƯỚI DANH MỤC Ở NGOÀI -->
                <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8 max-w-[1200px] mx-auto">
                    <!-- Danh mục sẽ được render bằng JS ở đây -->
                </div>
            </div>

            <!-- =========================================================================
                 6. MÀN HÌNH CHI TIẾT BÊN TRONG (SPLIT-PANE HOLOGRAPHIC) 
                 ========================================================================= -->
            <div id="detail-view" class="transition-all duration-1000 ease-in-out absolute inset-x-0 opacity-0 scale-105 pointer-events-none z-50">
                <!-- Nội dung chi tiết sẽ được render bằng JS ở đây -->
            </div>

        </main>
    </div>

    <!-- DỮ LIỆU & LOGIC XỬ LÝ (JAVASCRIPT) -->
    <script>
        // Dữ liệu danh mục và file
        const FILE_CATEGORIES = [
            { 
                id: 'baocao', 
                colors: { main: 'orange', text: 'text-orange-300', glow: 'from-orange-500/30 via-orange-500/5 to-transparent', border: 'group-hover:border-orange-500/50', iconBg: 'bg-orange-500/10' },
                iconName: 'file-text', iconColor: 'text-orange-300',
                title: 'BÁO CÁO', 
                desc: 'Xem kết quả sản xuất, tiến độ đơn hàng và tình hình chạy máy.', 
                files: [
                    { name: 'Báo Cáo Tiến Độ Sản Xuất', note: 'Theo dõi tổng quan tiến độ sản xuất (LSX) & sản lượng hàng ngày', url: 'https://docs.google.com/spreadsheets/d/1frC8tlVWaC0ID1VwoYoJC9pVF68oNsYJBZkunZHjNA0/edit?usp=sharing' },
                    { name: 'Báo Cáo Hao Hụt Vật Tư', note: 'Thống kê hao hụt nhựa (máy 150-1)', url: 'https://docs.google.com/spreadsheets/d/1psZjAGlIrs1Lett0Pn9jEGlPJQpjrxzmmYib0rq3vro/edit?usp=drive_link' },
                    { name: 'Nhật Ký Sự Cố Sản Xuất', note: 'Log dữ liệu dừng máy, sự cố sản xuất', url: 'https://docs.google.com/spreadsheets/d/1iglhTTQmQjEmm1k0GJlSKjFZ3RrG_xRrI41FNylNHPQ/edit?usp=drive_link' },
                    { name: 'Báo Cáo Hiệu Suất (OEE)', note: 'Xem thời gian máy chạy & các khoảng thời gian phải dừng máy', url: '#' }
                ] 
            },
            { 
                id: 'nhaplieu', 
                colors: { main: 'cyan', text: 'text-cyan-300', glow: 'from-cyan-500/30 via-cyan-500/5 to-transparent', border: 'group-hover:border-cyan-500/50', iconBg: 'bg-cyan-500/10' },
                iconName: 'database', iconColor: 'text-cyan-300',
                title: 'BIỂU NHẬP LIỆU', 
                desc: 'Nơi cập nhật dữ liệu chạy máy của các máy', 
                files: [
                    { name: 'Nhập Liệu Kéo Xoắn', note: 'Ghi nhận dữ liệu & sản lượng ca công đoạn kéo xoắn', url: 'https://docs.google.com/spreadsheets/d/1x9RWzuJ_pX-DptP_MDOa5h0dRLjsNWXgPlimsByF71w/edit?usp=sharing' },
                    { name: 'Nhập Liệu Bọc', note: 'Ghi nhận dữ liệu & sản lượng ca công đoạn bọc', url: 'https://docs.google.com/spreadsheets/d/173-VOqYWRt1a_AZ6ZKgBCsoieQhEJaAOTT6XWW1Xibk/edit?usp=sharing' },
                    { name: 'Nhập Liệu CCVL', note: 'Ghi nhận dữ liệu & sản lượng ca công đoạn CCVL', url: 'https://docs.google.com/spreadsheets/d/1pY_dUEmiuWnaArQ4K0h7gsxyR-3QlNynWUf03fgkkwY/edit?usp=sharing' },
                    { name: 'Giải Trình QTVT', note: 'Biểu ghi nhận & giải trình các vấn đề phát sinh trong công đoạn CCVL', url: 'https://docs.google.com/spreadsheets/d/1Gy1dMiSkyTACtj765kATRwQ1FXyiBX-IxvOzmzJWDHw/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'tinhtoan', 
                colors: { main: 'purple', text: 'text-purple-300', glow: 'from-purple-500/30 via-purple-500/5 to-transparent', border: 'group-hover:border-purple-500/50', iconBg: 'bg-purple-500/10' },
                iconName: 'calculator', iconColor: 'text-purple-300',
                title: 'CÔNG CỤ TÍNH TOÁN', 
                desc: 'File tính nhanh', 
                files: [
                    { name: 'Dự Báo Thời Gian Tiến Độ', note: 'Công cụ tính toán dự kiến thời gian hoàn thành đơn hàng/LSX.', url: 'https://docs.google.com/spreadsheets/d/1B-qRiKjlEZw4nArUaG-joRzh5U1ZUuW_f5EXNFBuQLE/edit?usp=sharing' },
                    { name: 'Tính Sức Chứa Ture', note: 'Tính toán sức chứa của ture & trọng lượng ture', url: 'https://docs.google.com/spreadsheets/d/1MnZ-QwGlFKC9L8kFWfntyOMCYbJwCnHejU9zJp61rU8/edit?usp=sharing' },
                    { name: 'Quy Đổi Trọng Lượng & Chiều Dài', note: 'Tool quy đổi nhanh hệ số Kg ↔ Mét cho các dòng máy DRUM.', url: 'https://docs.google.com/spreadsheets/d/1w2sHeFpmBOFY2s_ewWX4iTYAOqivarST2GYQwI-Jyus/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'nhansu', 
                colors: { main: 'emerald', text: 'text-emerald-300', glow: 'from-emerald-500/30 via-emerald-500/5 to-transparent', border: 'group-hover:border-emerald-500/50', iconBg: 'bg-emerald-500/10' },
                iconName: 'users', iconColor: 'text-emerald-300',
                title: 'QUẢN LÝ NHÂN SỰ', 
                desc: 'Theo dõi tình hình nhân sự', 
                files: [
                    { name: 'Danh Sách Nhân Sự', note: 'Chi tiết nhân sự của từng tổ', url: 'https://docs.google.com/spreadsheets/d/1IRFJuO6DXAPec66QtAcGtYAzpSO9_Xo_mSJ8fa5ORus/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'dinhmuc', 
                colors: { main: 'pink', text: 'text-pink-300', glow: 'from-pink-500/30 via-pink-500/5 to-transparent', border: 'group-hover:border-pink-500/50', iconBg: 'bg-pink-500/10' },
                iconName: 'activity', iconColor: 'text-pink-300',
                title: 'ĐỊNH MỨC SẢN XUẤT', 
                desc: 'Bảng chỉ tiêu sản lượng máy', 
                files: [
                    { name: 'Định Mức Sản Lượng (Ca/Máy)', note: 'Bảng chỉ tiêu sản lượng chuẩn cho từng máy.', url: 'https://docs.google.com/spreadsheets/d/1RRSFQK7GocjevGYC-uYkkXwRenyN2U0qHXtx2B69I44/edit?usp=sharing' }
                ] 
            },
            { 
                id: 'tailieu', 
                colors: { main: 'slate', text: 'text-slate-300', glow: 'from-slate-400/30 via-slate-400/5 to-transparent', border: 'group-hover:border-slate-400/50', iconBg: 'bg-slate-400/10' },
                iconName: 'archive', iconColor: 'text-slate-300',
                title: 'TÀI LIỆU & QUY TRÌNH', 
                desc: 'Kho lưu các hướng dẫn làm việc, nội quy và biểu mẫu chung.', 
                files: [
                    { name: 'Hướng Dẫn Công Nghệ', note: 'Hướng dẫn chung & thông số kỹ thuật ngành Trung thế & Hạ thế', url: 'https://drive.google.com/drive/folders/10QPukkdvOz2zybUfnsM7n64OiT0ascqz?usp=sharing' },
                    { name: 'Tài Liệu Nội Bộ', note: 'Hướng dẫn vận hành máy và các quy định của nhà máy', url: 'https://drive.google.com/drive/folders/1ZcukORZ2BSx71RL2ZUjxKoZ1GgmCiM1u?usp=sharing' },
                    { name: 'Trung Tâm Liên Kết', note: 'Cổng Hub lưu trữ các đường link hệ thống', url: 'https://maivanthanh1405.github.io/portal-san-xuat/' }
                ] 
            }
        ];

        // Khởi tạo Lucide Icons
        lucide.createIcons();

        // Xử lý Lời Chào theo thời gian
        const greetingEl = document.getElementById('greeting-text');
        const hour = new Date().getHours();
        if (hour < 12) greetingEl.textContent = 'Chào buổi sáng';
        else if (hour < 18) greetingEl.textContent = 'Chào buổi chiều';
        else greetingEl.textContent = 'Chào buổi tối';

        // Tham chiếu DOM
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const welcomeText = document.getElementById('welcome-text');
        const heroSection = document.getElementById('hero-section');
        const categoriesGrid = document.getElementById('categories-grid');
        const searchResultsContainer = document.getElementById('search-results-container');
        const searchResultsList = document.getElementById('search-results-list');
        const homeView = document.getElementById('home-view');
        const detailView = document.getElementById('detail-view');

        // Render Lưới Danh Mục Mặc Định
        function renderCategories() {
            categoriesGrid.innerHTML = '';
            FILE_CATEGORIES.forEach((cat, idx) => {
                const animDelay = idx * 100;
                const buttonHTML = `
                    <button
                        onclick="openCategoryDetail('${cat.id}')"
                        class="group relative text-left outline-none animate-in fade-in slide-in-from-bottom-12 h-full w-full"
                        style="animation-delay: ${animDelay}ms; animation-fill-mode: both;"
                    >
                        <div class="absolute -inset-px rounded-[2.5rem] bg-gradient-to-br from-white/[0.05] to-transparent opacity-100 group-hover:opacity-0 transition-opacity duration-500"></div>
                        <div class="absolute -inset-px rounded-[2.5rem] bg-gradient-to-br ${cat.colors.glow} opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
                        
                        <div class="relative h-full bg-[#030508]/80 backdrop-blur-[60px] backdrop-saturate-[150%] rounded-[2.5rem] p-8 md:p-10 overflow-hidden flex flex-col">
                            <div class="absolute -bottom-20 -right-20 w-64 h-64 ${cat.colors.iconBg} rounded-full blur-[80px] opacity-0 group-hover:opacity-100 transition-opacity duration-1000 pointer-events-none"></div>

                            <div class="flex items-start justify-between mb-12 relative z-10">
                                <div class="w-16 h-16 rounded-2xl ${cat.colors.iconBg} border border-white/[0.05] flex items-center justify-center group-hover:scale-110 group-hover:-translate-y-2 transition-all duration-700 shadow-inner backdrop-blur-md">
                                    <i data-lucide="${cat.iconName}" class="w-7 h-7 ${cat.iconColor}"></i>
                                </div>
                                <div class="w-10 h-10 rounded-full border border-white/[0.05] flex items-center justify-center text-slate-500 group-hover:bg-white/10 group-hover:text-white transition-all duration-500 bg-white/[0.01]">
                                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </div>
                            </div>

                            <div class="relative z-10 mt-auto">
                                <h3 class="text-2xl font-semibold text-white/90 mb-2 tracking-wide group-hover:text-white transition-colors">${cat.title}</h3>
                                <p class="text-base text-slate-400 font-light mb-6 opacity-80 leading-relaxed">${cat.desc}</p>
                                
                                <div class="flex items-center gap-2">
                                    <i data-lucide="activity" class="w-4 h-4 text-slate-600 group-hover:text-slate-400 transition-colors"></i>
                                    <span class="text-xs font-mono text-slate-600 group-hover:text-slate-400 transition-colors uppercase tracking-widest">
                                        ${cat.files.length} TÀI LIỆU
                                    </span>
                                </div>
                            </div>
                        </div>
                    </button>
                `;
                categoriesGrid.insertAdjacentHTML('beforeend', buttonHTML);
            });
            lucide.createIcons(); // Re-initialize icons for newly added DOM
        }

        // Khởi tạo render lần đầu
        renderCategories();

        // Xử lý Tìm Kiếm
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            
            if (query) {
                // UI Changes when searching
                welcomeText.classList.add('hidden');
                heroSection.classList.replace('mb-20', 'mb-10');
                heroSection.classList.replace('mt-8', 'mt-0');
                clearSearchBtn.classList.remove('hidden');
                clearSearchBtn.classList.add('flex');
                categoriesGrid.classList.add('hidden');
                searchResultsContainer.classList.remove('hidden');

                // Filter Logic
                const results = FILE_CATEGORIES.flatMap(cat => 
                    cat.files
                    .filter(f => f.name.toLowerCase().includes(query) || f.note.toLowerCase().includes(query))
                    .map(f => ({ ...f, categoryTitle: cat.title, colors: cat.colors, iconName: cat.iconName, iconColor: cat.iconColor }))
                );

                renderSearchResults(results);
            } else {
                clearSearch();
            }
        });

        clearSearchBtn.addEventListener('click', clearSearch);

        function clearSearch() {
            searchInput.value = '';
            welcomeText.classList.remove('hidden');
            heroSection.classList.replace('mb-10', 'mb-20');
            heroSection.classList.replace('mt-0', 'mt-8');
            clearSearchBtn.classList.add('hidden');
            clearSearchBtn.classList.remove('flex');
            categoriesGrid.classList.remove('hidden');
            searchResultsContainer.classList.add('hidden');
        }

        function renderSearchResults(results) {
            searchResultsList.innerHTML = '';
            if (results.length === 0) {
                searchResultsList.innerHTML = `
                    <div class="py-20 text-center flex flex-col items-center">
                        <div class="w-20 h-20 rounded-full bg-white/[0.02] border border-white/[0.05] flex items-center justify-center mb-6">
                            <i data-lucide="archive" class="w-8 h-8 text-slate-600"></i>
                        </div>
                        <p class="text-slate-400 font-light text-lg">Hệ thống không tìm thấy tài liệu phù hợp.</p>
                    </div>
                `;
            } else {
                results.forEach(file => {
                    const fileHTML = `
                        <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-6 p-4 rounded-[1.5rem] bg-transparent hover:bg-white/[0.03] transition-all border border-transparent hover:border-white/[0.05] group relative overflow-hidden">
                            <div class="w-14 h-14 rounded-full ${file.colors.iconBg} border border-white/[0.05] flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform duration-500">
                                <i data-lucide="${file.iconName}" class="w-7 h-7 ${file.iconColor}"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-medium text-slate-200 group-hover:text-white text-lg lg:text-xl truncate transition-colors tracking-wide">${file.name}</h4>
                                <div class="flex items-center gap-3 mt-1 text-sm text-slate-500 font-light">
                                    <span class="${file.colors.text} px-2 py-0.5 rounded-md bg-white/[0.03] border border-white/[0.05]">${file.categoryTitle}</span>
                                    <span class="truncate opacity-70">${file.note}</span>
                                </div>
                            </div>
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-slate-500 group-hover:bg-white/10 group-hover:text-white transition-all shrink-0">
                                <i data-lucide="arrow-right" class="w-5 h-5 -rotate-45"></i>
                            </div>
                        </a>
                    `;
                    searchResultsList.insertAdjacentHTML('beforeend', fileHTML);
                });
            }
            lucide.createIcons();
        }

        // Biến lưu trữ Timeout để gỡ khóa chiều cao
        let heightTimeout;

        // Xử lý mở Màn hình Chi Tiết (Split Pane)
        window.openCategoryDetail = function(categoryId) {
            const category = FILE_CATEGORIES.find(c => c.id === categoryId);
            if (!category) return;

            // [FIX] Khóa chiều cao hiện tại của trang để cuộn lên mượt mà không bị "giật cục"
            const mainEl = document.querySelector('main');
            clearTimeout(heightTimeout);
            mainEl.style.minHeight = mainEl.offsetHeight + 'px';
            
            // Lệnh cuộn lướt nhẹ nhàng lên đỉnh màn hình
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Render Detail View
            let filesHTML = '';
            category.files.forEach(file => {
                filesHTML += `
                    <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-6 rounded-[2rem] bg-transparent hover:bg-white/[0.03] border border-transparent hover:border-white/[0.05] transition-all duration-500 group relative overflow-hidden cursor-pointer">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/[0.02] to-transparent -translate-x-[100%] group-hover:translate-x-[100%] transition-transform duration-1000 ease-in-out pointer-events-none"></div>
                        
                        <div class="flex items-center gap-6 relative z-10 min-w-0 flex-1">
                            <div class="w-14 h-14 rounded-2xl bg-[#030508]/50 border border-white/[0.05] flex items-center justify-center ${category.colors.text} group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(255,255,255,0.05)] transition-all duration-500 shrink-0">
                                <i data-lucide="file-text" class="w-6 h-6 opacity-80 group-hover:opacity-100"></i>
                            </div>
                            
                            <div class="flex-1 min-w-0 pr-4">
                                <h4 class="font-medium tracking-wide text-white/80 text-xl group-hover:text-white transition-colors truncate mb-1">
                                    ${file.name}
                                </h4>
                                <p class="text-base text-slate-500 truncate font-light opacity-80 group-hover:opacity-100 transition-opacity">
                                    ${file.note}
                                </p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 relative z-10 shrink-0">
                            <span class="text-sm font-light text-slate-300 tracking-widest opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all duration-500 hidden sm:block">
                                MỞ FILE
                            </span>
                            <div class="w-14 h-14 rounded-full border border-white/[0.05] bg-[#030508]/50 group-hover:border-white/20 group-hover:bg-white/10 flex items-center justify-center text-slate-500 group-hover:text-white transition-all duration-500 shrink-0 shadow-sm group-hover:shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                                <i data-lucide="arrow-right" class="w-5 h-5 -rotate-45"></i>
                            </div>
                        </div>
                    </a>
                `;
            });

            detailView.innerHTML = `
                <div class="w-full h-[85vh] max-h-[800px] flex flex-col lg:flex-row gap-6 relative animate-in fade-in zoom-in-95 duration-700">
                    
                    <!-- BẢNG TRÁI -->
                    <div class="w-full lg:w-[38%] h-full rounded-[3rem] bg-[#030508]/60 backdrop-blur-[80px] backdrop-saturate-[200%] border border-white/[0.05] p-10 flex flex-col relative overflow-hidden shadow-[0_0_80px_rgba(0,0,0,0.5)]">
                        
                        <div class="absolute top-0 left-0 w-[150%] h-[150%] -translate-x-[20%] -translate-y-[20%] bg-gradient-to-br ${category.colors.glow} opacity-40 pointer-events-none"></div>
                        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_bottom,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:32px_32px] opacity-50"></div>

                        <button 
                            onclick="closeCategoryDetail()"
                            class="self-start flex items-center gap-3 text-slate-300 hover:text-white font-medium text-sm tracking-widest uppercase px-6 py-3.5 rounded-full bg-white/[0.05] border border-white/[0.1] hover:bg-white/[0.1] backdrop-blur-xl transition-all group relative z-20 shadow-lg"
                        >
                            <i data-lucide="chevron-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
                            Trở Về
                        </button>

                        <div class="mt-auto relative z-20 mb-8">
                            <div class="relative mb-12 inline-block">
                                <div class="absolute inset-0 bg-gradient-to-tr ${category.colors.glow} blur-2xl opacity-100 rounded-full scale-150"></div>
                                <div class="w-28 h-28 rounded-[2rem] ${category.colors.iconBg} border border-white/[0.1] flex items-center justify-center relative z-10 backdrop-blur-md shadow-2xl">
                                    <div class="scale-[2]">
                                        <i data-lucide="${category.iconName}" class="w-7 h-7 ${category.iconColor}"></i>
                                    </div>
                                </div>
                            </div>

                            <h2 class="text-5xl font-light text-white tracking-tight mb-6 leading-tight">
                                ${category.title}
                            </h2>
                            <p class="text-slate-300 font-light text-xl opacity-90 max-w-sm mb-10 leading-relaxed">
                                ${category.desc}
                            </p>
                            
                            <div class="inline-flex items-center gap-3 px-5 py-3 rounded-2xl bg-black/40 border border-white/[0.05] backdrop-blur-md">
                                <i data-lucide="database" class="w-5 h-5 text-slate-400"></i>
                                <span class="text-sm font-light text-slate-300 tracking-wide">${category.files.length} Dữ liệu khả dụng</span>
                            </div>
                        </div>
                    </div>

                    <!-- BẢNG PHẢI -->
                    <div class="w-full lg:w-[62%] h-full rounded-[3rem] bg-white/[0.01] backdrop-blur-[30px] border border-white/[0.03] p-4 lg:p-6 flex flex-col relative shadow-[0_0_50px_rgba(0,0,0,0.3)]">
                        <div class="px-8 py-6 flex items-center justify-between border-b border-white/[0.05] shrink-0">
                            <span class="text-sm font-light tracking-[0.2em] text-slate-400 uppercase">Tài Liệu Chi Tiết</span>
                            <i data-lucide="sparkles" class="w-5 h-5 text-slate-600"></i>
                        </div>

                        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3 custom-scrollbar pr-2">
                            ${filesHTML}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();

            // Chuyển đổi View
            homeView.classList.remove('opacity-100', 'scale-100', 'relative');
            homeView.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'absolute', 'inset-0');
            
            detailView.classList.remove('opacity-0', 'scale-105', 'pointer-events-none', 'absolute', 'inset-x-0');
            detailView.classList.add('opacity-100', 'scale-100', 'relative');

            // [FIX] Mở khóa chiều cao khi animation xong
            heightTimeout = setTimeout(() => {
                mainEl.style.minHeight = '';
            }, 1000);
        };

        window.closeCategoryDetail = function() {
            // [FIX] Tương tự, khóa khung hình lúc cuộn ra ngoài
            const mainEl = document.querySelector('main');
            clearTimeout(heightTimeout);
            mainEl.style.minHeight = mainEl.offsetHeight + 'px';

            // Cuộn mượt mà lên đầu
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Chuyển đổi View
            detailView.classList.remove('opacity-100', 'scale-100', 'relative');
            detailView.classList.add('opacity-0', 'scale-105', 'pointer-events-none', 'absolute', 'inset-x-0');

            homeView.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'absolute', 'inset-0');
            homeView.classList.add('opacity-100', 'scale-100', 'relative');
            
            // [FIX] Mở khóa chiều cao
            heightTimeout = setTimeout(() => {
                mainEl.style.minHeight = '';
            }, 1000);
        };

    </script>
</body>
</html>
