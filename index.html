    <style>
        @layer utilities {
            .animate-in { animation: animate-in 800ms cubic-bezier(0.16, 1, 0.3, 1) both; }
            .fade-in { animation-name: fade-in; }
            .slide-in-from-top-4 { animation-name: slide-in-from-top-4; }
            .slide-in-from-bottom-8 { animation-name: slide-in-from-bottom-8; }
            .slide-in-from-bottom-12 { animation-name: slide-in-from-bottom-12; }
            .zoom-in-95 { animation-name: zoom-in-95; }
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-in-from-top-4 {
            from { transform: translateY(-1rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slide-in-from-bottom-8 {
            from { transform: translateY(2rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slide-in-from-bottom-12 {
            from { transform: translateY(3rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes zoom-in-95 {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        /* Background caro mờ đặc trưng Soft UI */
        body {
            background-color: #f4f7fb;

                    { name: 'BIỂU KSQT MÁY DRUM', note: 'Thư mục chứa biểu đồ máy DRUM (Xoắn nhóm & Giáp sợi)', isFolder: true, targetId: 'bieu_kiemsoat_drum', iconOverride: 'folder-open', colorOverride: 'text-rose-500' }
                ]
            },
            // ================== CÁC THƯ MỤC CẤP 3 DÀNH RIÊNG CHO MÁY DRUM ================== //
            {
                id: 'bieu_kiemsoat_drum', hidden: true,
                colors: { bg: 'bg-rose-100', text: 'text-rose-500', glow: 'rgba(244,63,94,0.15)' },
                iconName: 'folder-open', 
                title: 'BIỂU KSQT MÁY DRUM',
                desc: 'Biểu đồ trực quan vận hành của máy DRUM.',
                files: [
                    { name: 'BIỂU KSQT MÁY DRUM - XOẮN NHÓM', note: 'Biểu kiếm soát quá trình máy DRUM xoắn nhóm', url: 'https://docs.google.com/spreadsheets/d/122nWlVpHPbSkf6UiM9cg00LmQY7EfbYsRizcWWE7odI/edit?usp=sharing' },
                    { name: 'BIỂU KSQT MÁY DRUM - GIÁP SỢI', note: 'Biểu kiểm soát quá trình máy DRUM giáp sợi', url: 'https://docs.google.com/spreadsheets/d/1TTrEYWA_GeuTo01L3ZBa0K5e-zqtrN7pSavX8wsQ5nY/edit?usp=sharing' }
                ]
            }
        ];

        lucide.createIcons();

        // Xử lý Lời Chào thời gian thực
        const greetingEl = document.getElementById('greeting-text');
        const hour = new Date().getHours();
        if (hour < 12) greetingEl.innerHTML = 'Chào buổi sáng <span class="text-sky-500">!</span>';
        else if (hour < 18) greetingEl.innerHTML = 'Chào buổi chiều <span class="text-sky-500">!</span>';
        else greetingEl.innerHTML = 'Chào buổi tối <span class="text-sky-500">!</span>';

        // Xử lý Đồng hồ thời gian thực
        const clockEl = document.getElementById('realtime-clock');
        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('vi-VN', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        const categoriesGrid = document.getElementById('categories-grid');
        const homeView = document.getElementById('home-view');
        const detailView = document.getElementById('detail-view');

        // Hàm render giao diện trang chủ
        function renderCategories() {
            categoriesGrid.innerHTML = '';
            const visibleCats = FILE_CATEGORIES.filter(cat => !cat.hidden);
            
            visibleCats.forEach((cat, idx) => {
                const animDelay = idx * 100;
                let extraClasses = '';
                if (visibleCats.length === 7 && idx === 6) {
                    extraClasses = 'md:col-span-2 lg:col-span-1 lg:col-start-2';
                }

                // Chuyển đổi style card sang Light Soft 3D
                const buttonHTML = `
                    <button
                        onclick="openCategoryDetail('${cat.id}')"
                        class="vision-container group relative text-left outline-none focus:outline-none animate-in fade-in slide-in-from-bottom-12 h-full w-full ${extraClasses}"
                        style="animation-delay: ${animDelay}ms; animation-fill-mode: both; perspective: 1200px;"
                    >
                        <div class="vision-card relative h-full bg-white border border-white/60 rounded-2xl p-6 md:p-8 flex flex-col" style="transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s ease-out; box-shadow: 0 8px 16px rgba(0,0,0,0.04), inset 0 2px 0 rgba(255,255,255,1);">
                            
                            <div class="flex items-start justify-between mb-8 relative z-10" style="transform: translateZ(30px);">
                                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-white to-[var(--bg-mix)] flex items-center justify-center border border-white" style="--bg-mix: ${cat.colors.bg.replace('bg-', '')}; box-shadow: 0 6px 12px ${cat.colors.glow}, inset 0 2px 4px white;">
                                    <i data-lucide="${cat.iconName}" class="w-7 h-7 ${cat.colors.text}"></i>
                                </div>
                                <div class="w-8 h-8 rounded-full border border-slate-100 bg-slate-50 flex items-center justify-center text-slate-400 group-hover:${cat.colors.bg} group-hover:${cat.colors.text} transition-colors">
                                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </div>
                            </div>

                            <div class="relative z-10 mt-auto" style="transform: translateZ(15px);">
                                <h3 class="text-xl font-extrabold text-textmain mb-2 tracking-wide">${cat.title}</h3>
                                <p class="text-sm text-textmuted font-medium mb-5 leading-relaxed">${cat.desc}</p>
                                
                                <div class="flex items-center gap-2">
                                    <i data-lucide="activity" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-[10px] font-bold font-mono text-slate-400 uppercase tracking-widest">
                                        ${cat.files.length} TÀI LIỆU
                                    </span>
                                </div>
                            </div>
                        </div>
                    </button>
                `;
                categoriesGrid.insertAdjacentHTML('beforeend', buttonHTML);
            });
            lucide.createIcons();
            initVisionProEffect();
        }

        // Script tạo độ nghiêng 3D điều chỉnh cho Light Theme
        window.initVisionProEffect = function() {
            const containers = document.querySelectorAll('.vision-container:not(.vision-init)');
            containers.forEach(container => {
                container.classList.add('vision-init');
                const card = container.querySelector('.vision-card');
                if(!card) return;
                
                container.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -5; 
                    const rotateY = ((x - centerX) / centerX) * 5;
                    
                    card.style.transition = 'transform 0.1s ease-out, box-shadow 0.1s ease-out';
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                    card.style.boxShadow = `0 20px 40px rgba(0,0,0,0.08), inset 0 2px 0 rgba(255,255,255,1)`;
                });
                
                container.addEventListener('mouseleave', () => {
                    card.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s ease-out';
                    card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    card.style.boxShadow = `0 8px 16px rgba(0,0,0,0.04), inset 0 2px 0 rgba(255,255,255,1)`;
                });
            });
        };

        renderCategories();

        let heightTimeout;

        // Xử lý mở Màn hình Chi Tiết
        window.openCategoryDetail = function(categoryId, parentId = null) {
            const category = FILE_CATEGORIES.find(c => c.id === categoryId);
            if (!category) return;

            let filesHTML = '';
            category.files.forEach(file => {
                const isFolder = file.isFolder;
                const tag = isFolder ? 'button' : 'a';
                const actionAttr = isFolder 
                    ? `onclick="openCategoryDetail('${file.targetId}', '${categoryId}')"` 
                    : `href="${file.url}" target="_blank" rel="noopener noreferrer"`;
                
                const arrowIcon = isFolder ? 'chevron-right' : 'arrow-right';
                const arrowRotate = isFolder ? '' : '-rotate-45';
                const actionText = isFolder ? 'MỞ MỤC' : 'MỞ FILE';
                
                const iconName = file.iconOverride || 'file-text';
                const iconColor = file.colorOverride || category.colors.text;

                filesHTML += `
                    <${tag} ${actionAttr} class="text-left vision-container group relative block w-full outline-none focus:outline-none mb-3" style="perspective: 1000px;">
                        <div class="vision-card flex items-center justify-between p-4 rounded-2xl bg-white border border-slate-100 cursor-pointer shadow-sm" style="transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s ease-out, border-color 0.3s;">
                            
                            <div class="flex items-center gap-4 relative z-10 min-w-0 flex-1" style="transform: translateZ(15px);">
                                <div class="w-12 h-12 rounded-[12px] bg-slate-50 border border-slate-100 flex items-center justify-center ${iconColor} transition-colors shrink-0 shadow-inner">
                                    <i data-lucide="${iconName}" class="w-5 h-5"></i>
                                </div>
                                
                                <div class="flex-1 min-w-0 pr-4">
                                    <h4 class="font-extrabold tracking-tight text-textmain text-lg truncate mb-0.5 group-hover:text-sky-600 transition-colors">
                                        ${file.name}
                                    </h4>
                                    <p class="text-sm text-textmuted truncate font-medium">
                                        ${file.note}
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center gap-4 relative z-10 shrink-0" style="transform: translateZ(20px);">
                                <span class="text-xs font-bold text-slate-400 tracking-widest opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all duration-300 hidden sm:block">
                                    ${actionText}
                                </span>
                                <div class="w-9 h-9 rounded-full border border-slate-200 bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-slate-100 group-hover:text-slate-600 transition-colors shrink-0">
                                    <i data-lucide="${arrowIcon}" class="w-4 h-4 ${arrowRotate}"></i>
                                </div>
                            </div>
                        </div>
                    </${tag}>
                `;
            });

            const backAction = parentId 
                ? `onclick="openCategoryDetail('${parentId}')"` 
                : `onclick="closeCategoryDetail()"`;

            detailView.innerHTML = `
                <div class="w-full h-[80vh] max-h-[700px] flex flex-col lg:flex-row gap-5 relative animate-in fade-in zoom-in-95 duration-500">
                    
                    <div class="w-full lg:w-[38%] h-full rounded-[2rem] bg-white border border-white shadow-[0_25px_50px_-12px_rgba(0,0,0,0.06),inset_0_2px_4px_white] p-8 flex flex-col relative overflow-hidden">
                        
                        <button 
                            ${backAction}
                            class="self-start flex items-center gap-2 text-slate-500 hover:text-textmain font-bold text-xs tracking-widest uppercase px-5 py-2.5 rounded-full bg-slate-50 border border-slate-200 hover:bg-white hover:shadow-md transition-all group relative z-20"
                        >
                            <i data-lucide="chevron-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
                            Trở Về
                        </button>

                        <div class="mt-auto relative z-20 mb-6">
                            <div class="relative mb-6 inline-block">
                                <div class="w-20 h-20 rounded-[1.2rem] ${category.colors.bg} flex items-center justify-center relative z-10 border border-white shadow-[0_8px_16px_${category.colors.glow},inset_0_2px_4px_white]">
                                    <i data-lucide="${category.iconName}" class="w-8 h-8 ${category.colors.text}"></i>
                                </div>
                            </div>

                            <h2 class="text-4xl font-extrabold text-textmain tracking-tight mb-3 leading-tight">
                                ${category.title}
                            </h2>
                            <p class="text-textmuted font-medium text-lg max-w-sm mb-6 leading-relaxed">
                                ${category.desc}
                            </p>
                            
                            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 border border-slate-100">
                                <i data-lucide="database" class="w-4 h-4 text-slate-400"></i>
                                <span class="text-xs font-bold text-slate-500 tracking-wide">${category.files.length} Dữ liệu khả dụng</span>
                            </div>
                        </div>
                    </div>

                    <div class="w-full lg:w-[62%] h-full rounded-[2rem] bg-white/60 backdrop-blur-md border border-white shadow-[0_8px_16px_rgba(0,0,0,0.02)] p-4 lg:p-5 flex flex-col relative">
                        <div class="px-4 py-2 flex items-center justify-between border-b border-slate-200/50 shrink-0 mb-2">
                            <span class="text-xs font-extrabold tracking-[0.15em] text-slate-400 uppercase">Tài Liệu Chi Tiết</span>
                            <i data-lucide="sparkles" class="w-4 h-4 text-slate-300"></i>
                        </div>

                        <div class="flex-1 overflow-y-auto overflow-x-hidden p-1 custom-scrollbar">
                            ${filesHTML}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();

            if (!parentId) {
                homeView.classList.remove('opacity-100', 'scale-100', 'relative');
                homeView.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'absolute', 'inset-0');
                
                detailView.classList.remove('opacity-0', 'scale-105', 'pointer-events-none', 'absolute', 'inset-x-0');
                detailView.classList.add('opacity-100', 'scale-100', 'relative');
            }

            window.scrollTo(0, 0);
            initVisionProEffect();
        };

        window.closeCategoryDetail = function() {
            const mainEl = document.querySelector('main');
            clearTimeout(heightTimeout);
            mainEl.style.height = mainEl.offsetHeight + 'px';

            window.scrollTo(0, 0);

            detailView.classList.remove('opacity-100', 'scale-100', 'relative');
            detailView.classList.add('opacity-0', 'scale-105', 'pointer-events-none', 'absolute', 'inset-x-0');

            homeView.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'absolute', 'inset-0');
            homeView.classList.add('opacity-100', 'scale-100', 'relative');
            
            heightTimeout = setTimeout(() => {
                mainEl.style.height = 'auto';
            }, 500);
        };

    </script>
</body>
</html>
